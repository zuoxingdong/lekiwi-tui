[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lekiwi-tui"
version = "0.1.0"
description = "Standalone LeKiwi TUI control center built with pyratatui (Rust/ratatui) and local lerobot launcher scripts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Xingdong Zuo", email = "18168681+zuoxingdong@users.noreply.github.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime deps. pyratatui (PyO3 bindings to Rust ratatui) is the UI engine.
# ruamel.yaml + pyyaml back the lossless config layer (config.py). evdev is optional
# (one kbd_listener backend) and imported lazily, so it is not a hard dep.
dependencies = [
    "pyratatui>=0.2.9",
    "ruamel.yaml>=0.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The TUI drives lerobot through the scripts/*.sh launchers, in whatever env `python`
# resolves to, which is often NOT the env the TUI itself was installed into. So lerobot
# is not a hard dependency: naming it here would install a second copy into the wrong
# place. This extra exists for the single-env case (`pip install -e .[robot]`), and the
# floor matches lekiwi_tui.lerobot_env.FLOOR, which is what the status card checks.
robot = [
    "lerobot>=0.6.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    # Test-only: the dataset-editor tests fake a v3 dataset, whose episode index is
    # parquet. On a robot machine pyarrow arrives with lerobot; CI installs only this
    # extra, so name it here or those tests skip themselves.
    "pyarrow>=15",
]

[project.scripts]
# Console entry points -> main() in lekiwi_tui/__main__.py
# (`python -m lekiwi_tui` also works).
lekiwi = "lekiwi_tui.__main__:main"

[tool.setuptools.packages.find]
# Flat repo layout (scripts/, assets/ are siblings of the package); pin discovery to the
# package tree only so setuptools auto-discovery does not error on the sibling dirs.
include = ["lekiwi_tui*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# The rule set is stated explicitly rather than inherited. ruff 0.16 widened its
# DEFAULT selection (UP/BLE/S/PLW/DTZ/I…), and since CI installs `ruff>=0.6.0` it
# floats to the newest release: a lint contract that changes on someone else's
# release date fails CI on commits that did not touch the code. These four are the
# pre-0.16 default (pyflakes + the pycodestyle errors that matter); widening is a
# deliberate edit, not a surprise.
select = ["E4", "E7", "E9", "F"]
ignore = ["E702"]
