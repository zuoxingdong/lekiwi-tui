name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Import check
        run: python -c "import lekiwi_tui"
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest lekiwi_tui/tests
